<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>TAP GO — medição de conexão (E-4)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px; background: #10151c; color: #e8eef5;
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { margin: 0 0 16px; color: #8fa3b8; font-size: 13px; }
      fieldset { border: 1px solid #2b3745; border-radius: 8px; margin: 0 0 14px; padding: 12px; }
      legend { color: #8fa3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
      label { display: block; margin: 8px 0 2px; font-size: 13px; color: #b9c8d8; }
      input[type='text'] {
        width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2b3745;
        background: #0a0e13; color: #e8eef5; font: 13px ui-monospace, monospace;
      }
      button {
        width: 100%; padding: 14px; margin-top: 8px; border: 0; border-radius: 8px;
        background: #2f7de1; color: #fff; font-size: 16px; font-weight: 600;
        min-height: 48px; cursor: pointer;
      }
      button.sec { background: #2b3745; }
      button:disabled { opacity: .45; cursor: default; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      code, .mono { font-family: ui-monospace, monospace; word-break: break-all; }
      #estado { padding: 12px; border-radius: 8px; background: #0a0e13; margin: 10px 0; font-weight: 600; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #1e2732; }
      th { color: #8fa3b8; font-weight: 500; font-size: 12px; }
      td.num { text-align: right; font-family: ui-monospace, monospace; }
      textarea {
        width: 100%; height: 150px; background: #0a0e13; color: #b9c8d8;
        border: 1px solid #2b3745; border-radius: 6px; padding: 8px;
        font: 12px ui-monospace, monospace;
      }
      .aviso { font-size: 12px; color: #d8a657; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Medição de conexão P2P — portão de E-4</h1>
    <p class="sub">
      Instrumento, não o jogo. Rode nos <strong>dois aparelhos</strong>, em rede de operadora
      (dados móveis, Wi-Fi desligado). Wi-Fi de casa conecta quase sempre e esconde o defeito.
    </p>
    <div id="app"></div>
    <script type="module" src="/medicao.ts"></script>
  </body>
</html>
