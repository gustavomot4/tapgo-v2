<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="TAP GO — disputa de pênaltis de um minuto, jogável no navegador, sem instalar nada."
    />
    <title>TAP GO — disputa de pênaltis</title>

    <!--
      Portão de privacidade de M9: zero <script> e zero folha de estilo de ORIGEM EXTERNA.
      O pouco de estilo abaixo é inline porque precisa valer ANTES de o CSS de M7 chegar — sem
      ele a página pisca branca no celular. Nada de CDN, nada de fonte remota, nada de analytics.
      O estilo do jogo mora em src/ui/estilo.css e é empacotado pelo build.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #0f1115;
        color: #e7e9ee;
      }
      body {
        min-height: 100dvh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      /* Visível só enquanto o módulo do jogo não substituiu o conteúdo de #jogo. */
      .antes {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        color: #a7b0c4;
        font-size: 0.9rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- M7 monta aqui. `bootGame` substitui o conteúdo inteiro deste elemento. -->
    <main id="jogo">
      <p class="antes">Carregando o jogo…</p>
    </main>

    <!--
      Sem <noscript> genérico: o jogo é 100% cliente, então "ative o JavaScript" é a única
      informação verdadeira e útil que cabe aqui.
    -->
    <noscript>
      <p class="antes">
        Este jogo precisa de JavaScript ligado no navegador. Ative e recarregue a página.
      </p>
    </noscript>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
